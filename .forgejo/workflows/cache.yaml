name: Nix

on:
  push:
  pull_request:

jobs:
  flake:
    runs-on: nixos-latest
    steps:
      - name: Install Node.js 24
        run: |
          nix profile install nixpkgs#nodejs_24
          echo "$HOME/.nix-profile/bin" >> "$GITHUB_PATH"

      - name: Check out repository
        uses: https://data.forgejo.org/actions/checkout@v6

      - name: Validate Cachix configuration
        env:
          CACHIX_CACHE_NAME: ${{ vars.CACHIX_CACHE_NAME }}
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: |
          test -n "$CACHIX_CACHE_NAME" || { echo "CACHIX_CACHE_NAME repository variable is required" >&2; exit 1; }
          test -n "$CACHIX_AUTH_TOKEN" || { echo "CACHIX_AUTH_TOKEN repository secret is required" >&2; exit 1; }

      - name: Configure Cachix
        uses: cachix/cachix-action@v16
        with:
          name: ${{ vars.CACHIX_CACHE_NAME }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Check flake
        run: nix flake check --print-build-logs

      - name: Build package
        run: nix build .#default --print-build-logs

      - name: Upload package to Cachix
        env:
          CACHIX_CACHE_NAME: ${{ vars.CACHIX_CACHE_NAME }}
        run: cachix push "$CACHIX_CACHE_NAME" "$(readlink -f result)"
